<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11182f"><title>Elsewhere — a no-gravity room</title>
<style>
:root{color-scheme:dark;--ink:#e9e8ff;--muted:#aaa9c9;--glass:rgba(17,24,47,.55)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;overflow:hidden;font:500 14px/1.35 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;background:#10152c;color:var(--ink)}#room{position:relative;width:100vw;height:100dvh;overflow:hidden;cursor:grab;touch-action:none;background:linear-gradient(132deg,#151d3a 0%,#252654 45%,#171331 100%)}#room:before{content:"";position:absolute;inset:7% 6%;border:1px solid rgba(255,255,255,.1);border-radius:32px;box-shadow:inset 0 0 120px rgba(4,4,19,.3),0 30px 90px rgba(0,0,0,.23);pointer-events:none}#window{position:absolute;top:10%;right:10%;width:min(29vw,250px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff 0 1px,transparent 2px),radial-gradient(circle at 75% 23%,#fff 0 1px,transparent 2px),radial-gradient(circle at 50% 80%,#aaa9ff 0 1px,transparent 2px),radial-gradient(circle at 64% 48%,#e2b6ff 0 2px,transparent 3px),radial-gradient(circle at 52% 50%,#7771ef 0%,#38338b 30%,#111533 70%);box-shadow:0 0 0 12px #0b1025,0 0 0 15px #e0dcff33,0 0 70px #6d5cff88;opacity:.95}#window:after{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid #b6b8ff55}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 7px #b7c2ff;opacity:.8;pointer-events:none}.thing{position:absolute;display:grid;place-items:center;user-select:none;will-change:transform;filter:drop-shadow(0 14px 12px #08091e70)}.ball{width:58px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 25%,#fff9 0 5%,transparent 17%),radial-gradient(circle at 38% 32%,#f9bcff 0,#bd67e4 48%,#653890 100%);box-shadow:inset -10px -10px 18px #4e267c88}.plant{width:65px;height:84px;align-items:end;font-size:59px;transform-origin:50% 80%}.cube{width:55px;height:55px;border-radius:8px;background:linear-gradient(135deg,#ffe6ac,#f49b61 55%,#af4c6e);box-shadow:inset 9px 9px 12px #fff8,inset -9px -9px 12px #7d315f88}.book{width:66px;height:43px;border-radius:3px 9px 9px 3px;background:linear-gradient(100deg,#f8d5c5 0 9%,#307e9c 10% 43%,#f1cd5e 44% 69%,#e36a6e 70%);transform-origin:center}.lamp{width:70px;height:70px;font-size:58px}.note{width:58px;height:58px;padding:7px;border-radius:3px;color:#5f486d;text-align:center;font-size:10px;font-weight:700;background:#fff19c;box-shadow:inset -7px -7px #dfc96e99;transform:rotate(-10deg)}#title{position:absolute;left:max(7vw,24px);bottom:max(8vh,64px);pointer-events:none;text-shadow:0 3px 18px #09091d}h1{margin:0;font:400 clamp(36px,7vw,78px)/.95 Georgia,serif;letter-spacing:-.06em}#title p{margin:9px 0 0;color:#c5c3e6;letter-spacing:.02em}#controls{position:absolute;z-index:2;top:max(24px,env(safe-area-inset-top));left:max(24px,env(safe-area-inset-left));display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 48px)}button,.return{border:1px solid #d8d7ff45;border-radius:999px;color:var(--ink);background:var(--glass);backdrop-filter:blur(9px);padding:9px 13px;font:inherit;cursor:pointer;text-decoration:none}button:hover,button:focus-visible,.return:hover,.return:focus-visible{background:#7771cf88;outline:none}#hint{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));color:var(--muted);text-align:right;font-size:12px;pointer-events:none}#message{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;letter-spacing:.05em;opacity:0;transition:opacity .4s;pointer-events:none}#message.show{opacity:1}@media(max-width:600px){#window{top:14%;right:8%;width:39vw}#title{bottom:84px}#hint{bottom:22px;left:24px;text-align:left}}@media(prefers-reduced-motion:reduce){.thing{transition:transform .5s ease-out}#message{transition:none}}
</style></head><body><main id="room" aria-label="An interactive zero gravity room"><div id="window" aria-hidden="true"></div><div id="stars" aria-hidden="true"></div><div id="controls"><a class="return" href="index.html">← Moonwell</a><button id="shuffle" aria-label="Gently rearrange the room">Drift</button><button id="sound" aria-pressed="false">Sound: off</button></div><div id="title"><h1>Elsewhere</h1><p>A room where the floor forgot its job.</p></div><div id="hint">Drag anything · tap empty space to breathe<br><span>Arrow keys nudge the whole room</span></div><div id="message">gravity is only a suggestion</div></main><script>
(()=>{const room=document.querySelector('#room'),reduced=matchMedia('(prefers-reduced-motion:reduce)').matches,specs=[['ball',''],['plant','🪴'],['cube',''],['book',''],['lamp','💡'],['note','YOU ARE HERE']],bodies=specs.map(([kind,label],i)=>{const el=document.createElement('div');el.className='thing '+kind;el.textContent=label;el.setAttribute('aria-label',kind==='note'?'A floating note':kind);el.tabIndex=0;room.append(el);return{el,x:innerWidth*(.18+i*.12),y:innerHeight*(.24+(i%3)*.22),vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,a:Math.random()*360,spin:(Math.random()-.5)*.18,drag:false}});for(let i=0;i<42;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.opacity=.2+Math.random()*.8;document.querySelector('#stars').append(s)}let active,last={x:0,y:0,t:0},soundOn=false,audio;function tone(freq=180){if(!soundOn)return;audio??=new AudioContext;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.16)}function draw(){const w=innerWidth,h=innerHeight;bodies.forEach(b=>{if(!b.drag&&!reduced){b.x+=b.vx;b.y+=b.vy;b.a+=b.spin;if(b.x<0||b.x>w-60)b.vx*=-1;if(b.y<0||b.y>h-75)b.vy*=-1;b.x=Math.max(0,Math.min(w-60,b.x));b.y=Math.max(0,Math.min(h-75,b.y))}b.el.style.transform=`translate(${b.x}px,${b.y}px) rotate(${b.a}deg)`});requestAnimationFrame(draw)}draw();function flash(){const m=document.querySelector('#message');m.classList.add('show');setTimeout(()=>m.classList.remove('show'),900)}room.addEventListener('pointerdown',e=>{const found=bodies.find(b=>b.el===e.target);if(found){active=found;found.drag=true;last={x:e.clientX,y:e.clientY,t:performance.now()};try{found.el.setPointerCapture(e.pointerId)}catch{}}else{bodies.forEach(b=>{b.vx+=(Math.random()-.5)*1.8;b.vy+=(Math.random()-.5)*1.8});flash();tone(120)}});room.addEventListener('pointermove',e=>{if(!active)return;const now=performance.now(),dt=Math.max(1,now-last.t);active.x+=e.clientX-last.x;active.y+=e.clientY-last.y;active.vx=(e.clientX-last.x)/dt*16;active.vy=(e.clientY-last.y)/dt*16;last={x:e.clientX,y:e.clientY,t:now}});function release(){if(active){active.drag=false;tone(340);active=null}}room.addEventListener('pointerup',release);room.addEventListener('pointercancel',release);document.querySelector('#shuffle').onclick=()=>{bodies.forEach(b=>{b.vx+=(Math.random()-.5)*2;b.vy+=(Math.random()-.5)*2;b.spin+=(Math.random()-.5)*.4});flash();tone(210)};document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent='Sound: '+(soundOn?'on':'off');e.currentTarget.setAttribute('aria-pressed',soundOn);if(soundOn)tone(330)};addEventListener('keydown',e=>{const n={ArrowLeft:[-.35,0],ArrowRight:[.35,0],ArrowUp:[0,-.35],ArrowDown:[0,.35]}[e.key];if(n){e.preventDefault();bodies.forEach(b=>{b.vx+=n[0];b.vy+=n[1]});tone(160)}})})();
</script></body></html>
