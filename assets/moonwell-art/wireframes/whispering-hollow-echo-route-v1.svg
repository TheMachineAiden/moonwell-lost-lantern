<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <style>text{font-family:ui-monospace,monospace;fill:#e2e8f0;font-size:16px}.label{font-size:20px;font-weight:bold;fill:#fef3c7}.small{font-size:13px;fill:#cbd5e1}.grid{stroke:#475569;stroke-width:1}.solid{fill:#334155;stroke:#94a3b8;stroke-width:2}.rune{fill:#6d28d9;stroke:#ddd6fe;stroke-width:3}.keeper{fill:#8b5cf6;stroke:#ddd6fe;stroke-width:2}.echo{fill:#67e8f9;fill-opacity:.42;stroke:#a5f3fc;stroke-width:2;stroke-dasharray:4 3}.path{fill:none;stroke:#c4b5fd;stroke-width:4;stroke-dasharray:8 6}.note{fill:#172554;stroke:#93c5fd;stroke-width:2}</style>
  <rect width="960" height="560" fill="#020617"/><text x="32" y="38" class="label">Whispering Hollow — delayed lantern echo route · v1</text><text x="32" y="64" class="small">One square = one 16×16 tile. The echo is a one-tile visual with no collider; only the existing 2×2 sentinel remains solid.</text>
  <g transform="translate(32 94)"><rect width="640" height="400" fill="#312e81" stroke="#64748b" stroke-width="3"/><g class="grid"><path d="M32 0V400M64 0V400M96 0V400M128 0V400M160 0V400M192 0V400M224 0V400M256 0V400M288 0V400M320 0V400M352 0V400M384 0V400M416 0V400M448 0V400M480 0V400M512 0V400M544 0V400M576 0V400M608 0V400M0 32H640M0 64H640M0 96H640M0 128H640M0 160H640M0 192H640M0 224H640M0 256H640M0 288H640M0 320H640M0 352H640M0 384H640"/></g><rect class="solid" x="288" y="192" width="64" height="64"/><text x="293" y="228" class="small">sentinel</text><circle class="rune" cx="528" cy="304" r="14"/><text x="548" y="310" class="small">1 · remember</text><circle class="rune" cx="304" cy="144" r="14"/><text x="324" y="150" class="small">2 · cast Echo</text><circle class="rune" cx="114" cy="240" r="14"/><text x="134" y="246" class="small">3 · resolve</text><path class="path" d="M528 304C452 258 376 192 304 144C238 168 176 208 114 240"/><rect class="keeper" x="296" y="136" width="16" height="16"/><text x="286" y="126" class="small">Luna</text><rect class="echo" x="296" y="136" width="16" height="16"/><text x="326" y="126" class="small">Echo starts here, retraces to rune 1</text><rect class="echo" x="520" y="296" width="16" height="16"/><text x="493" y="334" class="small">Echo holds rune 1</text></g>
  <rect x="704" y="94" width="224" height="400" rx="8" class="note"/><text x="728" y="130" class="label">Sequence</text><text x="728" y="166" class="small">1. Touch the first rune.</text><text x="728" y="198" class="small">2. Walk to the second.</text><text x="728" y="230" class="small">3. Press E / Echo.</text><text x="728" y="262" class="small">4. Echo retraces the path</text><text x="728" y="282" class="small">   and anchors at rune 1.</text><text x="728" y="320" class="small">5. Luna reaches rune 3</text><text x="728" y="340" class="small">   before the echo fades.</text><text x="728" y="388" class="small">No path, water, tree, or</text><text x="728" y="408" class="small">sentinel collider changes.</text>
  <text x="32" y="532" class="small">Mobile control: a 44px labelled Echo button sits below the existing pause button, outside the 320×200 play canvas and touch steering pad.</text>
</svg>
