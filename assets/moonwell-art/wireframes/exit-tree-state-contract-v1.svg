<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Moonwell exit tree state and collider contract</title><desc id="desc">Four one-cell exit states: ordinary tree closed, tree beginning to part while still solid, parted tree with visible glimmer while still solid, and open passage with collider removed. The exit uses its current home cell in every level.</desc>
<style>.bg{fill:#081321}.p{fill:#10253a;stroke:#5e8aa4;stroke-width:2}.cell{fill:#164e63;stroke:#49728c;stroke-width:2}.tree{fill:#14532d;stroke:#8fd89a;stroke-width:3}.trunk{fill:#8b5a2b}.glow{fill:#fef08a}.cyan{fill:#67e8f9}.tx{fill:#e5f6ff;font:700 19px system-ui}.sm{fill:#b7d9ec;font:14px system-ui}.ok{fill:#fff1a8;font:700 14px system-ui}.no{fill:#fca5a5;font:700 14px system-ui}</style><rect class="bg" width="1200" height="480"/><text class="tx" x="36" y="40">One-tile exit tree: visual, collision, and transition state agreement</text><text class="sm" x="36" y="66">Each large square represents the same one 16 × 16 logical tile scaled for review. No detached door, lantern marker, portal ring, or secondary walkable cell.</text>
<g transform="translate(36 110)"><rect class="p" width="260" height="320" rx="12"/><text class="tx" x="18" y="32">1. Closed</text><rect class="cell" x="66" y="60" width="128" height="128"/><path class="tree" d="M130 72C86 74 82 126 104 145H156C178 126 174 74 130 72Z"/><rect class="trunk" x="118" y="120" width="24" height="58"/><text class="ok" x="18" y="230">solid collider: cell only</text><text class="sm" x="18" y="258">Reads as an ordinary border tree.</text><text class="sm" x="18" y="282">No exit trigger.</text></g>
<g transform="translate(324 110)"><rect class="p" width="260" height="320" rx="12"/><text class="tx" x="18" y="32">2. Opening</text><rect class="cell" x="66" y="60" width="128" height="128"/><path class="tree" d="M130 72C86 74 82 126 104 145H124V86H136V145H156C178 126 174 74 130 72Z"/><rect class="trunk" x="112" y="120" width="16" height="58"/><rect class="trunk" x="132" y="120" width="16" height="58"/><rect class="glow" x="126" y="104" width="8" height="48"/><text class="ok" x="18" y="230">solid collider: remains</text><text class="sm" x="18" y="258">A narrow seam proves the tree is parting.</text><text class="sm" x="18" y="282">No transition until state 4.</text></g>
<g transform="translate(612 110)"><rect class="p" width="260" height="320" rx="12"/><text class="tx" x="18" y="32">3. Revealed</text><rect class="cell" x="66" y="60" width="128" height="128"/><path class="tree" d="M130 72C89 76 90 129 108 145L122 132V88H128V151H104V165C88 145 90 88 130 72Z"/><path class="tree" d="M130 72C171 76 170 129 152 145L138 132V88H132V151H156V165C172 145 170 88 130 72Z"/><path class="cyan" d="M130 92L150 158H110Z"/><rect class="glow" x="122" y="104" width="16" height="50"/><text class="ok" x="18" y="230">solid collider: remains</text><text class="sm" x="18" y="258">Glimmer is behind the trunk.</text><text class="sm" x="18" y="282">Required pre-removal beat.</text></g>
<g transform="translate(900 110)"><rect class="p" width="260" height="320" rx="12"/><text class="tx" x="18" y="32">4. Open</text><rect class="cell" x="66" y="60" width="128" height="128"/><path class="tree" d="M130 72C95 78 94 132 110 159L122 142V84H130Z"/><path class="tree" d="M130 72C165 78 166 132 150 159L138 142V84H130Z"/><path class="cyan" d="M130 84L164 174H96Z" opacity=".6"/><path class="glow" d="M130 100L152 164H108Z"/><text class="no" x="18" y="230">no collider: passable</text><text class="sm" x="18" y="258">Existing home-radius trigger.</text><text class="sm" x="18" y="282">Walk through the forest boundary.</text></g></svg>
