<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
  <title id="title">Moonwell footprint and collider plan</title>
  <desc id="desc">A tile-grid visual contract. Ordinary actors and objects occupy one 16 by 16 cell. A small number of landmarks deliberately occupy two by two cells and use matching collision cells. Current oversized representative sprites are shown beside their proposed footprints.</desc>
  <style>.bg{fill:#07111f}.panel{fill:#0e2138;stroke:#7dd3fc;stroke-width:2}.cell{fill:#123047;stroke:#36516d}.solid{fill:#475569;stroke:#f8fafc;stroke-width:2}.pass{fill:#14532d;stroke:#bbf7d0;stroke-width:2}.hit{fill:#fbbf24;fill-opacity:.42;stroke:#fde68a;stroke-width:2}.label{fill:#e0f2fe;font:600 19px system-ui,sans-serif}.copy{fill:#bae6fd;font:14px system-ui,sans-serif}.note{fill:#fef3c7;font:13px system-ui,sans-serif}</style>
  <rect class="bg" width="960" height="610"/>
  <text x="32" y="37" class="label">Moonwell — footprint and collider contract</text><text x="32" y="59" class="copy">Orange overlay = collision cells. Art anchors to the same grid it occupies; decoration may rise upward only.</text>
  <g transform="translate(32 86)"><rect class="panel" width="280" height="230" rx="8"/><text class="label" x="16" y="29">1 × 1 default</text><text class="copy" x="16" y="51">keeper · firefly · memory · flower · rune</text><g transform="translate(112 78)"><rect class="cell" width="64" height="64"/><path class="cell" d="M16 0v64M32 0v64M48 0v64M0 16h64M0 32h64M0 48h64"/><rect class="hit" x="16" y="16" width="16" height="16"/><circle fill="#c4b5fd" cx="24" cy="24" r="6"/></g><text class="note" x="16" y="174">One logical cell. A keeper uses a centred</text><text class="note" x="16" y="194">10 × 10 body collider inside that cell.</text></g>
  <g transform="translate(340 86)"><rect class="panel" width="280" height="230" rx="8"/><text class="label" x="16" y="29">2 × 2 exception</text><text class="copy" x="16" y="51">grove · sentinel · lantern · skybell · altar</text><g transform="translate(112 78)"><rect class="cell" width="64" height="64"/><path class="cell" d="M16 0v64M32 0v64M48 0v64M0 16h64M0 32h64M0 48h64"/><rect class="hit" x="16" y="16" width="32" height="32"/><rect class="solid" x="16" y="16" width="32" height="32"/></g><text class="note" x="16" y="174">A landmark owns exactly four marked cells.</text><text class="note" x="16" y="194">No 3 × 3 art for a 1-cell collider.</text></g>
  <g transform="translate(648 86)"><rect class="panel" width="280" height="230" rx="8"/><text class="label" x="16" y="29">Water and bridge</text><text class="copy" x="16" y="51">water = solid · bridge cells = passable</text><g transform="translate(80 78)"><rect class="solid" width="112" height="32"/><rect class="pass" x="32" y="8" width="48" height="16"/><path class="cell" d="M16 0v32M32 0v32M48 0v32M64 0v32M80 0v32M96 0v32M0 16h112"/></g><text class="note" x="16" y="174">The bridge is a row of normal tile cells,</text><text class="note" x="16" y="194">not a wide image with a separate rule.</text></g>
  <g transform="translate(32 346)"><rect class="panel" width="896" height="230" rx="8"/><text class="label" x="16" y="29">Representative current art, reviewed against the proposed grid</text><text class="copy" x="16" y="51">These are the existing source sprites—not new production art. They show why the next pass must crop/redraw to the contract above.</text>
    <g transform="translate(54 82)"><rect class="cell" width="64" height="64"/><path class="cell" d="M16 0v64M32 0v64M48 0v64M0 16h64M0 32h64M0 48h64"/><rect class="hit" x="16" y="32" width="16" height="16"/><image href="../../moonwell-keeper-walk-v3.png" x="8" y="5" width="48" height="52" preserveAspectRatio="xMidYMid meet"/><text class="copy" x="-12" y="90">Keeper: recrop to 1-cell width</text></g>
    <g transform="translate(342 82)"><rect class="cell" width="64" height="64"/><path class="cell" d="M16 0v64M32 0v64M48 0v64M0 16h64M0 32h64M0 48h64"/><rect class="hit" x="16" y="16" width="32" height="32"/><image href="../production/moonwell-tree-cluster-v2.png" x="16" y="16" width="32" height="32"/><text class="copy" x="-18" y="90">Tree: one 2 × 2 object record</text></g>
    <g transform="translate(630 82)"><rect class="cell" width="64" height="64"/><path class="cell" d="M16 0v64M32 0v64M48 0v64M0 16h64M0 32h64M0 48h64"/><rect class="hit" x="16" y="16" width="32" height="32"/><image href="../production/moonwell-sentinel-v3.png" x="16" y="16" width="32" height="32"/><text class="copy" x="-30" y="90">Sentinel: 2 × 2 collision mask</text></g>
  </g>
</svg>
