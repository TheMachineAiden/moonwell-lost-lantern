<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc">
  <title id="title">Moonwell level layout wireframes</title>
  <desc id="desc">Four 20 by 13 tile wireframes showing the shared blocked-cell map, player starts, lanterns, memories, and each area's puzzle objects. Every square is one 16 pixel game tile.</desc>
  <style>
    .page{fill:#07111f}.panel{fill:#0e2138;stroke:#7dd3fc;stroke-width:2}.grid{stroke:#36516d;stroke-width:1}.wall{fill:#24455b}.path{fill:#123047}.start{fill:#c4b5fd}.home{fill:#fbbf24}.memory{fill:#e2e8f0}.light{fill:#fef08a}.puzzle{fill:#c084fc}.bridge{fill:#4ade80}.label{fill:#e0f2fe;font:600 17px system-ui,sans-serif}.small{fill:#bae6fd;font:12px system-ui,sans-serif}.legend{fill:#dbeafe;font:13px system-ui,sans-serif}
  </style>
  <rect class="page" width="960" height="730"/>
  <text x="34" y="38" class="label">Moonwell — grid-first level wireframe</text>
  <text x="34" y="59" class="small">Each small square is one 16 × 16 gameplay cell. Symbols mark logical anchor cells; the next art pass must not silently exceed their footprint.</text>
