<g transform="translate(900 115)"><rect class="panel" width="560" height="710" rx="10"/><text class="label" x="26" y="36">Implementation legend &amp; constraints</text><text class="small" x="26" y="70">Green filled cell: ordinary tree, solid 16 × 16 collider.</text><text class="small" x="26" y="98">Gold-outline cell: exit tree. Closed/opening = solid; open = passable.</text><text class="small" x="26" y="126">Cyan route: an intentional readable corridor, never an implied collider.</text><text class="small" x="26" y="154">Visual tree footprint: 16 × 16 tile source, optional +2/−2 px canopy overhang only.</text><text class="small" x="26" y="182">Player and every normal prop: exactly one 16 px tile. No new two-tile objects.</text><text class="note" x="26" y="230">Recommended treatment: “layered side forest”</text><text class="small" x="26" y="258">• Keep the hard tree border, but vary its visual depth with non-colliding</text><text class="small" x="42" y="278">  canopy/understory pixels inside each edge tile.</text><text class="small" x="26" y="306">• Add 10 interior trees per area as 2-cell clusters facing the borders.</text><text class="small" x="26" y="334">• Keep central puzzle lanes at least one logical empty cell wide, with</text><text class="small" x="42" y="354">  artifacts/bridges/runes visibly separated from tree bases.</text><text class="small" x="26" y="382">• Replace the current three-cell “trees + glow” exit with one stateful</text><text class="small" x="42" y="402">  ordinary tree at the current home cell; see exit-state wireframe.</text><text class="note" x="26" y="452">Exit-cell state contract</text><text class="mono" x="26" y="480">closed: ordinary tree / solid / no transition trigger</text><text class="mono" x="26" y="505">opening: parted seam visible / still solid / no trigger</text><text class="mono" x="26" y="530">open: glimmer exposed / non-solid / trigger at home radius</text><text class="small" x="26" y="578">This layout is intentionally a pre-implementation decision record.</text><text class="small" x="26" y="602">It does not change game.js, collision records, routes, or sprites.</text></g>
</svg>
