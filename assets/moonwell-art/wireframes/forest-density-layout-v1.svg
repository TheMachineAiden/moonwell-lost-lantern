<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
<title id="title">Moonwell forest-density layout proposal v1</title>
<desc id="desc">Deterministic 20 by 13 cell proposals for all four Moonwell levels. Every listed tree and exit cell has a one-cell solid collider except an exit tree in open state. Cyan routes are the deliberately clear player lanes. Gold dots are lights, violet diamonds are runes or bells, and blue cells are Moonroot water.</desc>
<style>
 .bg{fill:#081321}.panel{fill:#10253a;stroke:#4c7894;stroke-width:2}.grid{stroke:#2e526b;stroke-width:1}.tree{fill:#15583e;stroke:#9de6a6;stroke-width:1}.edge{fill:#0f432f;stroke:#6dbb83;stroke-width:1}.exit{fill:#2f7a51;stroke:#fff1a8;stroke-width:2}.route{fill:none;stroke:#6ee7f5;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.88}.water{fill:#14516d}.bridge{fill:#c4a4e9;stroke:#fae8ff;stroke-width:1}.point{fill:#fde68a;stroke:#fff7cc;stroke-width:1}.rune{fill:#d8b4fe;stroke:#f5f3ff;stroke-width:1}.label{fill:#e5f6ff;font:700 20px system-ui,sans-serif}.small{fill:#b7d9ec;font:14px system-ui,sans-serif}.note{fill:#fff1b7;font:600 14px system-ui,sans-serif}.mono{fill:#d8f3ff;font:12px ui-monospace,monospace}
</style>
<rect class="bg" width="1500" height="930"/>
<text class="label" x="36" y="40">Moonwell v1 — denser forest, preserved routes</text>
<text class="small" x="36" y="64">Grid origin is top-left. Each square = one logical 16 × 16 px tile. Tree art may overhang up to 2 px horizontally/1 px upward only; its collider remains exactly its filled cell.</text>
<defs>
 <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path class="grid" d="M16 0H0V16" fill="none"/></pattern>
 <g id="edge"><rect class="edge" width="16" height="16"/></g><g id="tree"><rect class="tree" width="16" height="16"/></g><g id="exit"><rect class="exit" width="16" height="16"/></g>
 <g id="light"><circle class="point" cx="8" cy="8" r="3"/></g><g id="rune"><path class="rune" d="M8 2L14 8 8 14 2 8Z"/></g>
</defs>
<!-- Metadata is the authoritative implementation list; x,y are grid coordinates. -->
<metadata>
Lantern Glade: addedTrees=2,4;3,4;15,4;16,4;2,7;3,7;14,8;15,8;8,9;9,9. existingTrees=3,2;4,2;13,2;14,2;7,4;8,4;11,6;12,6;5,8;6,8. exit=17,10. route=start(1,1)-lights(16,1)(4,9)(10,5)-exit(17,10).
Moonroot Crossing: addedTrees=2,3;3,3;8,2;9,2;14,3;15,3;5,9;6,9;14,9;15,9. existingTrees=3,2;4,2;13,2;14,2;7,4;8,4;11,6;12,6;5,8;6,8. exit=2,10. water=1..18,6..7; bridge=8..11,6..7 after moonflower. route=start(2,2)-flower(16,4)-bridge(8..11,6..7)-exit(2,10).
Whispering Hollow: addedTrees=2,3;3,3;6,3;7,3;15,3;16,3;3,9;4,9;13,9;14,9. existingTrees=3,2;4,2;13,2;14,2;7,4;8,4;11,6;12,6;5,8;6,8. exit=2,10. echo route=start(17,2)-rune1(16,9)-rune2(9,4)-rune3(3,7)-exit(2,10).
Starfall Grove: addedTrees=2,3;3,3;7,3;8,3;14,3;15,3;3,8;4,8;13,8;14,8. existingTrees=3,2;4,2;13,2;14,2;7,4;8,4;11,6;12,6;5,8;6,8. exit=3,10. route=start(17,2)-bells(16,9)(10,4)(3,7)-hidden lights(9,9)(14,3)-exit(3,10).
</metadata>
